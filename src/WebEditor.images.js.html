<script>
  // Images and files: IndexedDB image cache (lazy per-ID reads, pruning, crash guard), fetch queue, file badges, Drive-ID parsing, lightbox.
  // One of several WebEditor.*.js.html fragments sharing a single global scope; include order is set in WebEditor.html.

  const imageCache = {};     // fileId → { type:'image', dataUrl } | { type:'pdf', viewUrl } | null

  const pendingImages = new Set(); // fileIds currently being fetched to avoid duplicate requests

  let dbPromise = null;              // Promise<IDBDatabase> — opened once in init(), reused thereafter
  let imageCacheReady = Promise.resolve(); // resolves once a crash-triggered cache wipe (if any) has finished

  // localStorage flag set while a dialog session is still loading its images. A renderer crash
  // ("Aw, Snap") never fires pagehide, so a flag still set at the next launch means the previous
  // session died mid-load and its cache is suspect.
  const IMAGE_LOAD_FLAG_KEY = 'pdb_images_loading';

  /**
   * Opens (or reuses) the IndexedDB database for the persistent image cache.
   * Called eagerly in init() so the DB is ready before onDataLoaded fires.
   * v2 adds a `savedAt` index so pruneImageCache() can read keys and ages without loading the
   * (large) image values.
   * @returns {Promise<IDBDatabase>}
   */
  function openImageDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      try {
        const req = indexedDB.open('pdb_images', 2);
        req.onupgradeneeded = e => {
          const store = e.target.result.objectStoreNames.contains('images')
            ? e.target.transaction.objectStore('images')
            : e.target.result.createObjectStore('images');
          if (!store.indexNames.contains('savedAt')) store.createIndex('savedAt', 'savedAt');
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = () => reject(req.error);
      } catch (e) {
        reject(e);
      }
    });
    return dbPromise;
  }

  /**
   * Whether a stored cache entry is valid and younger than the TTL.
   * @param {{savedAt: number, data: Object}|undefined} entry - Record read from the images store.
   * @param {number} now - Current time in ms.
   * @param {number} ttlMs - Maximum entry age in ms.
   * @returns {boolean}
   */
  function isImageCacheEntryFresh(entry, now, ttlMs) {
    return !!entry?.data && now - entry.savedAt <= ttlMs;
  }

  /**
   * Picks the cache keys to delete: every expired entry, plus the oldest live
   * entries beyond maxEntries.
   * @param {Array<{key: string, savedAt: number}>} entries - All cached entries, any order.
   * @param {number} now - Current time in ms.
   * @param {number} ttlMs - Maximum entry age in ms.
   * @param {number} maxEntries - Maximum number of live entries to keep.
   * @returns {string[]} Keys to delete.
   */
  function selectImageCacheEvictions(entries, now, ttlMs, maxEntries) {
    const sorted = [...entries].sort((a, b) => a.savedAt - b.savedAt);
    const expired = sorted.filter(e => now - e.savedAt > ttlMs);
    const live = sorted.filter(e => now - e.savedAt <= ttlMs);
    const overflow = live.slice(0, Math.max(0, live.length - maxEntries));
    return [...expired, ...overflow].map(e => e.key);
  }

  /**
   * Deletes every entry from the IndexedDB image cache. Always resolves.
   * @returns {Promise<void>}
   */
  async function clearImageCache() {
    try {
      const db = await openImageDB();
      await new Promise(resolve => {
        const tx = db.transaction('images', 'readwrite');
        tx.objectStore('images').clear();
        tx.oncomplete = tx.onerror = tx.onabort = () => resolve();
      });
    } catch (e) {
      // IndexedDB unavailable — nothing to clear
    }
  }

  /**
   * Detects a previous session that crashed while loading images (its flag was never
   * released) and wipes the cache so the same data can't crash this launch too. Then
   * raises the flag for this session. Called once from init().
   * @returns {void}
   */
  function startImageCacheGuard() {
    let crashed = false;
    try {
      crashed = localStorage.getItem(IMAGE_LOAD_FLAG_KEY) === '1';
      localStorage.setItem(IMAGE_LOAD_FLAG_KEY, '1');
    } catch (e) {
      // storage blocked — no crash detection
    }
    window.addEventListener('pagehide', releaseImageCacheGuard);
    if (crashed) imageCacheReady = clearImageCache();
  }

  /**
   * Clears the "session still loading images" flag. Idempotent.
   * @returns {void}
   */
  function releaseImageCacheGuard() {
    try {
      localStorage.removeItem(IMAGE_LOAD_FLAG_KEY);
    } catch (e) {
      // storage blocked
    }
  }

  /**
   * Reads the given file IDs from IndexedDB and returns the fresh ones. Only the
   * requested keys are read, so memory use tracks what the list shows rather than
   * the size of the whole cache. Always resolves.
   * @param {string[]} ids - Drive file IDs.
   * @returns {Promise<Object<string, Object>>} fileId → cached result, hits only.
   */
  async function loadCachedImages(ids) {
    const hits = {};
    try {
      await imageCacheReady;
      const db = await openImageDB();
      const ttlMs = schema.imageCacheTtlDays * 24 * 60 * 60 * 1000;
      const now = Date.now();
      await new Promise(resolve => {
        const tx = db.transaction('images');
        const store = tx.objectStore('images');
        ids.forEach(id => {
          store.get(id).onsuccess = e => {
            if (isImageCacheEntryFresh(e.target.result, now, ttlMs)) hits[id] = e.target.result.data;
          };
        });
        tx.oncomplete = tx.onerror = tx.onabort = () => resolve();
      });
    } catch (e) {
      // IndexedDB unavailable — caller falls back to the server
    }
    return hits;
  }

  /**
   * Deletes expired entries and the oldest ones beyond schema.imageCacheMaxEntries.
   * Walks the savedAt index with a key cursor, so image values are never loaded.
   * Fire-and-forget; always resolves.
   * @returns {Promise<void>}
   */
  async function pruneImageCache() {
    try {
      await imageCacheReady;
      const db = await openImageDB();
      const entries = await new Promise(resolve => {
        const out = [];
        const req = db.transaction('images').objectStore('images').index('savedAt').openKeyCursor();
        req.onsuccess = e => {
          const cursor = e.target.result;
          if (!cursor) { resolve(out); return; }
          out.push({ key: cursor.primaryKey, savedAt: cursor.key });
          cursor.continue();
        };
        req.onerror = () => resolve(out);
      });
      const ttlMs = schema.imageCacheTtlDays * 24 * 60 * 60 * 1000;
      const doomed = selectImageCacheEvictions(entries, Date.now(), ttlMs, schema.imageCacheMaxEntries);
      if (!doomed.length) return;
      const store = db.transaction('images', 'readwrite').objectStore('images');
      doomed.forEach(key => store.delete(key));
    } catch (e) {
      // IndexedDB unavailable — nothing to prune
    }
  }

  /**
   * Persists a single fetched image result to IndexedDB. Fire-and-forget.
   * @param {string} fileId - Google Drive file ID used as the record key.
   * @param {Object} result - Value returned by getImagesDataUrls for this file ID.
   * @returns {void}
   */
  function saveToIndexedDB(fileId, result) {
    openImageDB().then(db => {
      db.transaction('images', 'readwrite').objectStore('images')
        .put({ savedAt: Date.now(), data: result }, fileId);
    }).catch(() => {});
  }

  /**
   * Creates a badge element for non-image Drive files (PDF, folder, no-access).
   * @param {string} type - 'pdf' | 'folder' | 'no-access'
   * @param {string} [viewUrl]
   * @returns {HTMLElement}
   */
  function buildFileBadge(type, viewUrl) {
    if (type === 'no-access') {
      const span = document.createElement('span');
      span.className = 'pdf-link pdf-link--no-access';
      span.textContent = 'No access';
      return span;
    }
    const a = document.createElement('a');
    a.href = viewUrl;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.className = 'pdf-link' + (type === 'folder' ? ' pdf-link--folder' : '');
    a.textContent = type === 'folder' ? 'Folder' : 'PDF';
    return a;
  }

  /**
   * Stores a result in imageCache and updates every not-yet-loaded img tagged
   * with this file ID: sets its src, or swaps it for a PDF/folder/no-access badge.
   * @param {string} fileId - Google Drive file ID.
   * @param {Object|null} result - Cached or freshly fetched getImagesDataUrls result.
   * @returns {void}
   */
  function applyImageResult(fileId, result) {
    imageCache[fileId] = result;
    document.querySelectorAll(`img[data-file-id="${fileId}"]`).forEach(el => {
      el.removeAttribute('data-file-id');
      if (result?.type === 'image') {
        el.src = result.dataUrl;
      } else if (result) {
        el.parentNode.replaceChild(buildFileBadge(result.type, result.viewUrl), el);
      }
    });
  }

  /**
   * Finds all img elements tagged with data-file-id (not yet loaded) and resolves
   * each unique file ID from IndexedDB first, then from the server for the misses.
   * Uses pendingImages to prevent duplicate in-flight requests for the same file.
   * @returns {Promise<void>}
   */
  async function queueImageFetch() {
    const ids = [];
    document.querySelectorAll('img[data-file-id]').forEach(img => {
      const id = img.dataset.fileId;
      if (!id || pendingImages.has(id)) return;
      pendingImages.add(id);
      ids.push(id);
    });
    if (!ids.length) {
      if (!pendingImages.size) releaseImageCacheGuard();
      return;
    }
    const misses = [];
    for (let i = 0; i < ids.length; i += schema.imageFetchBatchSize) {
      const chunk = ids.slice(i, i + schema.imageFetchBatchSize);
      const hits = await loadCachedImages(chunk);
      chunk.forEach(fileId => {
        if (fileId in hits) {
          pendingImages.delete(fileId);
          applyImageResult(fileId, hits[fileId]);
        } else {
          misses.push(fileId);
        }
      });
    }
    if (misses.length) fetchImagesFromServer(misses);
    else if (!pendingImages.size) releaseImageCacheGuard();
  }

  /**
   * Fetches the given file IDs from the server in batches through a worker pool,
   * applies each result to the DOM and saves it to IndexedDB. Releases the crash
   * guard once no fetch is pending.
   * @param {string[]} ids - Drive file IDs missing from the cache.
   * @returns {void}
   */
  function fetchImagesFromServer(ids) {
    const batchSize = schema.imageFetchBatchSize;
    const concurrency = schema.imageFetchConcurrency;
    let offset = 0;
    /** Fetches the next batch of ids and, on completion, calls itself again. @returns {void} */
    const fetchNext = () => {
      if (offset >= ids.length) return;
      const batch = ids.slice(offset, offset + batchSize);
      offset += batchSize;
      google.script.run
        .withSuccessHandler(results => {
          batch.forEach(fileId => {
            pendingImages.delete(fileId);
            const result = results[fileId] ?? null;
            applyImageResult(fileId, result);
            saveToIndexedDB(fileId, result);
          });
          if (!pendingImages.size) releaseImageCacheGuard();
          fetchNext();
        })
        .withFailureHandler(() => {
          batch.forEach(fileId => pendingImages.delete(fileId));
          if (!pendingImages.size) releaseImageCacheGuard();
          fetchNext();
        })
        .getImagesDataUrls(batch);
    };
    startWorkerPool(concurrency, Math.ceil(ids.length / batchSize), fetchNext);
  }

  /**
   * Extracts the Google Drive file ID from a sharing URL or returns the input
   * unchanged if it looks like a bare file ID already.
   * Supported formats:
   *   https://drive.google.com/file/d/FILE_ID/view
   *   https://drive.google.com/drive/u/0/folders/FOLDER_ID (or without the /u/0/ account segment)
   *   https://drive.google.com/open?id=FILE_ID
   *   FILE_ID (bare alphanumeric string ≥ 10 chars)
   * Server-side counterpart: parseDriveId() in Utils.js — keep URL patterns aligned.
   * @param {string} url
   * @returns {string|null} File ID, or null if not parseable.
   */
  function extractDriveId(url) {
    if (!url) return null;
    const patterns = [
      /\/folders\/([a-zA-Z0-9_-]+)/,
      /\/d\/([a-zA-Z0-9_-]+)/,
      /[?&]id=([a-zA-Z0-9_-]+)/,
    ];
    for (const pattern of patterns) {
      const m = url.match(pattern);
      if (m) return m[1];
    }
    if (/^[a-zA-Z0-9_-]{10,}$/.test(url.trim())) return url.trim();
    return null;
  }

  /**
   * Applies a server file-fetch result to an image/PDF preview pair.
   * @param {HTMLImageElement} imgEl
   * @param {HTMLElement} pdfEl - Container with an <a> child for non-image files.
   * @param {{type: string, dataUrl?: string, viewUrl?: string}|null} result
   */
  function applyFileResult(imgEl, pdfEl, result) {
    if (!result) { imgEl.style.display = 'none'; return; }
    if (result.type === 'image') {
      imgEl.src = result.dataUrl;
      imgEl.style.display = 'block';
      pdfEl.style.display = 'none';
    } else {
      imgEl.src = '';
      imgEl.style.display = 'none';
      const link = pdfEl.querySelector('a');
      if (result.type === 'no-access') {
        link.removeAttribute('href');
        link.textContent = 'No access to this file';
      } else {
        link.href = result.viewUrl;
        link.textContent = result.type === 'folder' ? 'Open Folder in Drive' : 'Open PDF in Drive';
      }
      pdfEl.style.display = 'block';
    }
  }

  /**
   * Opens the lightbox overlay for a given Drive file ID. Uses the cached data
   * URL if available; otherwise fetches it from the server and updates the
   * lightbox image once the response arrives.
   * @param {string} fileId - Google Drive file ID.
   */
  function openLightbox(fileId) {
    const cached = imageCache[fileId];
    if (cached?.type === 'no-access') return;
    if (cached && cached.type !== 'image') {
      window.open(cached.viewUrl, '_blank', 'noopener,noreferrer');
      return;
    }
    const lightbox = document.getElementById('lightbox');
    const imgEl = document.getElementById('lightbox-img');
    const pdfMsg = lightbox.querySelector('.lightbox-pdf-msg');
    lightbox.style.display = 'flex';
    pdfMsg.style.display = 'none';
    imgEl.style.display = '';
    if (cached?.type === 'image') {
      imgEl.src = cached.dataUrl;
    } else {
      imgEl.src = '';
      google.script.run
        .withSuccessHandler(results => {
          const result = results[fileId] ?? null;
          imageCache[fileId] = result;
          saveToIndexedDB(fileId, result);
          if (result?.type === 'image') {
            imgEl.src = result.dataUrl;
          } else if (result?.type === 'no-access') {
            lightbox.style.display = 'none';
          } else if (result) {
            imgEl.style.display = 'none';
            pdfMsg.querySelector('a').href = result.viewUrl;
            pdfMsg.style.display = 'flex';
          }
        })
        .withFailureHandler(() => {})
        .getImagesDataUrls([fileId]);
    }
  }
</script>
